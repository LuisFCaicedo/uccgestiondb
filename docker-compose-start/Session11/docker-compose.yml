version: '3.8'

services:
  banco_postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: banco
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - banco_network

  generador_banco_app:
    build: ./app
    depends_on:
      banco_postgres:
        condition: service_healthy
    environment:
      DB_HOST: banco_postgres
      DB_USER: admin
      DB_PASS: admin1234
      DB_NAME: banco
    ports:
      - "5000:5000"
    networks:
      - banco_network

networks:
  banco_network:
    driver: bridge
